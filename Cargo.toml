[package]
# Port of Measurements 3.0.3 (Mrbysco/Measurements, MIT). Minecraft Java 1.21.1 NeoForge;
# the port targets Horizon 26.3 at the pin in horizon-mod.toml. Clean-room Rust rewrite from
# the mod's behaviour (notes.md); local-only until publishing is approved, publishable under
# MIT with this source.
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "measurements"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Measurements for Horizon: a tape measure that reports distances and deltas"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). Any other registry dependency must be
# pinned with `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
