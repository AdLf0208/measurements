id = "measurements"
name = "Measurements"
version = "0.2.0"
description = """A port of Measurements for Horizon: the tape measure places point A on the
first right-click of a block and point B on the second, and reports the Euclidean distance with
the per-axis deltas in the action bar; a shift-right-click removes the latest measurement. The
original draws a box around the two points on the client, which this port reports as text
instead."""
authors = ["Mrbysco", "AdLf0208"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity: Cargo's
# package name and version are not the mod's.
api = "0.2"
# "both" is the installation side: the sessions live on the server (an integrated server in a
# single-player world, or a dedicated one) and the readout is a server action bar.
side = "both"
# "May add blocks, items, mob effects and entity types": the tape measure item is data/ here.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
