[mod]
id = "measurements"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The pure tape-measure model (standalone crate lib, injected as
# `crate::game::measurements`).
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "measurements"
source = "runtime.rs"

# Game-side glue: per-player sessions and the action-bar readout.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "measurements_state"
source = "support.rs"

# The content half is inside this bundle (`data/measurements-content.hmod`, the
# built `content/measurements.hmod`): this writes it to `.horizon-cache/` and
# appends it to the dev-mod list, so one `.hnmod` installs the tape measure and
# the code. The registry keeps one file per project, so a split port could not
# be listed; AE2 ships the same pattern.
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

# Right-click with the tape measure: arm point A or report the distance.
[[injection]]
id = "use-item-on"
hook = "use_item_on"
hook_version = 1
kind = "HEAD"
helper = "use_item_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "claimed", ty = "&mut bool", value = "claimed" },
]

# A player's server tick: clear once the tape is no longer held.
[[injection]]
id = "player-tick"
hook = "player_tick"
hook_version = 1
kind = "HEAD"
helper = "player_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# End of a running server tick: prune players who left.
[[injection]]
id = "server-tick"
hook = "server_tick"
hook_version = 1
kind = "HEAD"
helper = "server_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "ServerTickPhase", value = "phase" },
]

# A player left: drop the session at once (upstream clears on logout too).
[[injection]]
id = "player-logged-out"
hook = "player_logged_out"
hook_version = 1
kind = "HEAD"
helper = "player_logged_out.rs"
bindings = [
  { name = "player", ty = "u128", value = "player" },
]
